<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Agrited | Premium Poultry & Agricultural Solutions</title>

    <meta name="description"
          content="Premium poultry genetics, vaccines, nutrition and turnkey poultry solutions.">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
     <script>
(function () {

    const saved = localStorage.getItem("theme");

    if (
        saved === "dark" ||
        (!saved &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
        document.documentElement.classList.add("dark");
    }

})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Tailwind -->
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: '#2E8B57',
                    secondary: '#F4B400',
                }
            }
        }
    }
</script>

    <script src="https://cdn.tailwindcss.com"></script>
     <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary:'#166534',

                        secondary:'#22C55E',

                        accent:'#F59E0B',

                        dark:'#0F172A',

                        light:'#F8FAFC'

                    },

                    fontFamily:{

                        heading:['Poppins'],

                        body:['Inter']

                    }

                }

            }

        }

    </script>

    <!-- Alpine -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
    <!-- HTMX -->

    <script src="https://unpkg.com/htmx.org@2.0.7"></script>

    <!-- AOS -->

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="assets/css/style.css"/>

</head>

<body class="bg-light text-slate-700 font-body">

        <div hx-get="partials/projects-preview.html"

        <div hx-get="partials/statistics.html"
             hx-trigger="load"></div>

        <div hx-get="partials/latest-news.html"

<script src="assets/js/gallery.js"></script>
