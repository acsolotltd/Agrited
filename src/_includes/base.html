<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('section');

        // 1. Instantly trigger active state on click for a snappy SPA feel
        navLinks.forEach(link => {
            link.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                updateActiveNav(targetId);
            });
        });

        // 2. Track scrolling to dynamically update active navbar item
        const observerOptions = {
            root: null,
            // Triggers when the section crosses the middle 50% of the screen
            rootMargin: '-40% 0px -60% 0px',
            threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    updateActiveNav(entry.target.id);
                }
            });
        }, observerOptions);

        // Observe all sections with an ID
        sections.forEach(section => {
            if (section.id) observer.observe(section);
        });

        // Core function to handle Tailwind CSS class toggles for the animation
        function updateActiveNav(activeId) {
            navLinks.forEach(link => {
                const indicator = link.querySelector('.nav-indicator');
                const textNode = link.querySelector('.nav-text');
                const isMatch = link.getAttribute('data-target') === activeId;

                if (isMatch) {
                    // ACTIVE STATE
                    // Change text color to active
                    textNode.classList.remove('text-slate-600', 'dark:text-slate-400', 'group-hover:text-slate-900', 'dark:group-hover:text-white');
                    textNode.classList.add('text-emerald-700', 'dark:text-emerald-400');

                    // Fade and scale in the background pill
                    if (indicator) {
                        indicator.classList.remove('opacity-0', 'scale-90');
                        indicator.classList.add('opacity-100', 'scale-100');
                    }
                } else {
                    // INACTIVE STATE
                    // Revert text color
                    textNode.classList.add('text-slate-600', 'dark:text-slate-400', 'group-hover:text-slate-900', 'dark:group-hover:text-white');
                    textNode.classList.remove('text-emerald-700', 'dark:text-emerald-400');

                    // Fade and scale out the background pill
                    if (indicator) {
                        indicator.classList.add('opacity-0', 'scale-90');
                        indicator.classList.remove('opacity-100', 'scale-100');
                    }
                }
            });
        }
    });
</script>
