  <!-- Hero Section -->
    <section id="{{ page-id }}" class="relative pt-32 pb-20 lg:pt-40 lg:pb-28 overflow-hidden border-b border-slate-100 dark:border-slate-800">
        <!-- Ambient Background -->
        <div class="absolute inset-0 bg-slate-50 dark:bg-slate-950 -z-10"></div>
        <div class="absolute top-0 left-1/2 w-[800px] h-[400px] bg-emerald-500/20 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
             <span class="text-emerald-600 dark:text-emerald-400 font-bold tracking-wider uppercase text-sm mb-4 block">{{ title }}</span>
             {{ headerTitle | safe }}
            <p class="text-lg md:text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">
                {{ headerSubtitle | safe }}
               
            </p>
        </div>
    </section>
