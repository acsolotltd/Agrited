<!-- Hero Section -->
<section id="{{ page-id }}" class="relative pt-32 pb-24 lg:pt-48 lg:pb-32 overflow-hidden">
    
    <!-- Dynamic Background Image Area -->
    <div class="absolute inset-0 -z-20 isolate">
        <!-- The Image -->
        <img 
            src="{{ headerImage | safe }}" 
            alt="{{ title }}" 
            class="w-full h-full object-cover object-center"
        >
        <!-- Dark Overlay for Text Readability -->
        <div class="absolute inset-0 bg-slate-900/70 dark:bg-slate-950/80"></div>
    </div>

    <!-- Ambient Glow Effect (Positioned behind text) -->
    <div class="absolute top-1/2 left-1/2 w-[600px] h-[300px] bg-emerald-500/30 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 pointer-events-none -z-10"></div>
    
    <!-- Bottom Fade to blend seamlessly with the next section -->
    <div class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-slate-50 dark:from-slate-950 to-transparent pointer-events-none -z-10"></div>

    <!-- Content Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
        
        <!-- Eyebrow Title -->
        <span class="inline-block px-4 py-1.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold tracking-widest uppercase text-xs sm:text-sm mb-6 backdrop-blur-sm border border-emerald-500/30">
            {{ title | safe }}
        </span>
        
        <!-- Main Title (HTML structure is now in the template, not front matter) -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white tracking-tight mb-6">
            {{ headerTitle | safe }} 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">
                {{ headerHighlight | safe }}
            </span>
        </h1>
        
        <!-- Subtitle -->
        <p class="text-lg md:text-xl text-slate-300 max-w-2xl mx-auto leading-relaxed">
            {{ headerSubtitle }}
        </p>
        
    </div>
</section>
