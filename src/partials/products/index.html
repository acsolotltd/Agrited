                    x-transition:enter-start="opacity-0 translate-y-4"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    class="group bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-2xl hover:shadow-emerald-900/10 dark:hover:shadow-emerald-900/20 transition-all duration-300 flex flex-col cursor-pointer"
                    @click="openModal(product)">

                    <!-- Product Image Area -->
                    <div class="relative h-64 overflow-hidden bg-slate-100 dark:bg-slate-800">
                        <img :src="product.img" :alt="product.title"
                            class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-in-out">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>

                        <!-- Badge -->
                        <div class="absolute top-4 left-4">
                            <span
                                class="px-3 py-1 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm text-emerald-600 dark:text-emerald-400 text-xs font-extrabold uppercase tracking-wider rounded-lg shadow-sm"
                                x-text="product.badge"></span>
                        </div>
                    </div>
                    
                    <!-- Product Content Area -->
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors"
                            x-text="product.title"></h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed flex-1 line-clamp-2"
                            x-text="product.description"></p>

                        <!-- Action Button -->
                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800 mt-auto">
                            <button type="button"
                                class="inline-flex items-center justify-between w-full text-sm font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
                                View Specifications
                                <span
                                    class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center group-hover:bg-emerald-50 dark:group-hover:bg-emerald-900/30 transition-colors">
                                    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform"
                                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="products.filter(p => activeFilter === 'all' || activeFilter === p.category).length === 0"
            style="display: none;" class="text-center py-20">
            <p class="text-slate-500 dark:text-slate-400">No products found in this category.</p>
        </div>
    </div>

    <!-- Detail Modal Wrapper -->
    <div x-show="isModalOpen" style="display: none;" x-trap.inert.noscroll="isModalOpen"
        @keydown.escape.window="closeModal" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title"
        role="dialog" aria-modal="true">

        <!-- Backdrop -->
        <div x-show="isModalOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="closeModal"
            class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

        <!-- Modal Panel Container -->
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div x-show="isModalOpen" x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                class="relative transform overflow-hidden rounded-3xl bg-white dark:bg-slate-900 text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-slate-200 dark:border-slate-800">

                <!-- Close Button -->
                <button @click="closeModal"
                    class="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/20 hover:bg-black/40 text-white backdrop-blur-md transition-colors focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>

                <template x-if="selectedProduct">
                    <div>
                        <!-- Header Image -->
                        <div class="h-64 sm:h-72 w-full relative">
                            <img :src="selectedProduct.img" :alt="selectedProduct.title"
                                class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent"></div>
                            <div class="absolute bottom-6 left-6 right-6 text-white">
                                <span
                                    class="px-2.5 py-1 mb-3 inline-block bg-emerald-500 rounded-md text-xs font-bold uppercase tracking-wide"
                                    x-text="selectedProduct.badge"></span>
                                <h2 class="text-3xl font-extrabold" id="modal-title" x-text="selectedProduct.title">
                                </h2>
                            </div>
                        </div>

                        <!-- Content & Specs Table -->
                        <div class="p-6 sm:p-8">
                            <p class="text-slate-600 dark:text-slate-300 text-base mb-8 leading-relaxed"
                                x-text="selectedProduct.description"></p>

                            <h4
                                class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider mb-4 border-b border-slate-200 dark:border-slate-700 pb-2">
                                Technical Specifications</h4>

                            <div
                                class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700/50">
                                <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700/50">
                                    <tbody class="divide-y divide-slate-200 dark:divide-slate-700/50">
                                        <template x-for="(spec, index) in selectedProduct.specs" :key="index">
                                            <tr :class="index % 2 === 0 ? 'bg-white/50 dark:bg-slate-900/50' : ''">
                                                <td class="py-3.5 pl-4 pr-3 text-sm font-semibold text-slate-900 dark:text-white w-1/3"
                                                    x-text="spec.label"></td>
                                                <td class="px-3 py-3.5 text-sm text-slate-600 dark:text-slate-400"
                                                    x-text="spec.value"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Action Buttons -->
                            <div class="mt-8 flex flex-col sm:flex-row gap-4">
                                <a href="#contact"
                                    class="flex-1 inline-flex justify-center items-center px-6 py-3.5 border border-transparent text-sm font-bold rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                                    Request Quote
                                </a>
                                <button @click="closeModal" type="button"
                                    class="flex-1 inline-flex justify-center items-center px-6 py-3.5 border border-slate-300 dark:border-slate-700 text-sm font-bold rounded-xl text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 focus:outline-none transition-colors">
                                    Close Details
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

</section>
