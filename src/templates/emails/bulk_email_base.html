<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff; }
        .header { background-color: #166534; padding: 20px; text-align: center; color: #ffffff; border-radius: 6px 6px 0 0; }
        .content { padding: 30px 20px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 6px 6px; }
    </style>
</head>
<body style="background-color: #f4f7f6; padding: 20px 0;">
    <div class="container">
        <div class="header">
            <h3 style="margin: 0;">Agrited Updates</h3>
        </div>
        <div class="content">
            <!-- Render line breaks while preserving {{ name }} placeholders for Brevo -->
            {{ message|linebreaksbr }}
        </div>
    </div>
</body>
</html>
