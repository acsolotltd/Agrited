<!-- Booking & Agents Section -->
<section id="booking" 
    x-data="{
        contacts: [
            { name: 'Noureddine', phone: '08145858246', region: 'North' },
            { name: 'Thusitha', phone: '08065865062', region: 'South West' },
            { name: 'Olaitan', phone: '09077053506', region: 'South East' },
            { name: 'Busayo', phone: '08033905252', region: 'Central' },
            { name: 'Elizabeth', phone: '07044219967', region: 'South South' },
            { name: 'Esther', phone: '08063954196', region: 'North Central' },
            { name: 'Chioma', phone: '08145176518', region: 'East' }
        ],
        formatPhone(phone) { return [phone.slice(0,4), phone.slice(4,7), phone.slice(7)].join(' '); },
        getWaUrl(phone) { return `https://wa.me/234${phone.substring(1)}`; },
        
        // Desktop scroll navigation logic
        scroll(direction) {
            const slider = this.$refs.slider;
            // 320px covers the card width (300px) + the gap (20px)
            const scrollAmount = direction === 'left' ? -320 : 320;
            slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
    }"
    class="relative py-24 bg-white dark:bg-slate-950 overflow-hidden">
    
    <!-- Decorative Background Elements -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-emerald-500/5 dark:bg-emerald-500/10 blur-[100px] rounded-full pointer-events-none"></div>

    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Dedicated CTA Header -->
        <div class="flex flex-col lg:flex-row items-center justify-between gap-10 mb-16 bg-slate-50 dark:bg-slate-900/50 p-8 sm:p-12 rounded-[2rem] border border-slate-100 dark:border-slate-800/60 shadow-sm">
            <div class="text-center lg:text-left max-w-2xl">
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4">
                    Ready to scale your farm?
                </h2>
                <p class="text-lg text-slate-600 dark:text-slate-400">
                    Skip the wait. Place your order directly with headquarters for priority processing on Day Old Chicks, Premixes, and Farm Equipment.
                </p>
            </div>
            <div class="shrink-0 w-full lg:w-auto">
                <button @click="$dispatch('open-booking', 'Headquarters Dispatch')" 
                    class="w-full lg:w-auto group relative inline-flex items-center justify-center gap-3 px-8 py-4 bg-emerald-600 text-white font-bold rounded-2xl overflow-hidden shadow-xl shadow-emerald-600/20 hover:shadow-emerald-600/40 hover:-translate-y-0.5 transition-all duration-300">
                    <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black pointer-events-none"></span>
                    <span class="relative">Book Order Directly</span>
                    <svg class="relative w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </button>
            </div>
        </div>

        <!-- Regional Agents Header with Navigation Arrows -->
        <div class="mb-8 flex items-end justify-between">
            <div>
                <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Or contact a regional agent</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 md:hidden">Swipe to see available representatives</p>
            </div>
            
            <!-- Desktop Navigation Buttons (Hidden on mobile) -->
            <div class="hidden md:flex items-center gap-3">
                <button @click="scroll('left')" aria-label="Scroll left"
                    class="p-3 rounded-full bg-slate-50 hover:bg-emerald-50 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all hover:scale-105 active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button @click="scroll('right')" aria-label="Scroll right"
                    class="p-3 rounded-full bg-slate-50 hover:bg-emerald-50 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all hover:scale-105 active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Mobile-first scroll-snap slider -->
        <div class="-mx-4 sm:-mx-6 lg:mx-0">
            <!-- ADDED x-ref="slider" HERE -->
            <div x-ref="slider" class="flex overflow-x-auto snap-x snap-mandatory gap-5 px-4 sm:px-6 lg:px-0 pb-10 no-scrollbar scroll-smooth">
                <template x-for="contact in contacts" :key="contact.phone">
                    <div class="snap-start shrink-0 w-[280px] sm:w-[300px] bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-slate-100 dark:border-slate-800 flex flex-col hover:border-emerald-500/30 transition-colors group">
                        
                        <!-- Avatar & Info -->
                        <div class="flex items-center gap-4 mb-6">
                            <div class="h-14 w-14 rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400 group-hover:scale-110 group-hover:bg-emerald-100 dark:group-hover:bg-emerald-900/50 transition-transform duration-300 shrink-0">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div>
                                <h4 class="text-lg font-bold text-slate-900 dark:text-white" x-text="contact.name"></h4>
                                <span class="text-xs font-medium px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" x-text="contact.region"></span>
                            </div>
                        </div>

                        <div class="mb-6">
                            <p class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone Line</p>
                            <p class="text-lg text-emerald-600 dark:text-emerald-400 font-medium tracking-wide" x-text="formatPhone(contact.phone)"></p>
                        </div>

                        <!-- Action Buttons -->
                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <a :href="`tel:${contact.phone}`"
                                class="flex justify-center items-center gap-2 bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white px-3 py-3 rounded-xl text-sm font-semibold transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                Call
                            </a>
                            <a :href="getWaUrl(contact.phone)" target="_blank" rel="noopener noreferrer"
                                class="flex justify-center items-center gap-2 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-500/10 dark:hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 px-3 py-3 rounded-xl text-sm font-semibold transition-colors">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.614-.087-.112-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"></path></svg>
                                Chat
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>
