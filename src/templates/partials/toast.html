<!-- Global Toast Container -->
<div 
    x-data="{ 
        toasts: [],
        add(event) {
            const toast = { 
                id: Date.now(), 
                message: event.detail.message, 
                type: event.detail.type 
            };
            this.toasts.push(toast);
            
            // Auto-remove after 4 seconds
            setTimeout(() => { this.remove(toast.id) }, 4000);
        },
        remove(id) {
            this.toasts = this.toasts.filter(t => t.id !== id);
        }
    }"
    @show-toast.window="add($event)"
    class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"
>
    <!-- Toast Template -->
    <template x-for="toast in toasts" :key="toast.id">
        <div 
            x-show="true"
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            class="px-6 py-4 rounded-xl shadow-xl text-white font-medium flex items-center justify-between gap-4 pointer-events-auto min-w-[250px] max-w-sm"
            :class="{
                'bg-emerald-600': toast.type === 'success',
                'bg-red-500': toast.type === 'error',
                'bg-blue-500': toast.type === 'info'
            }"
        >
            <span x-text="toast.message" class="text-sm"></span>
            
            <!-- Manual Close Button -->
            <button @click="remove(toast.id)" class="text-white/80 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </template>
</div>
