<div 
    id="toast-auth" 
    class="fixed bottom-5 right-5 z-[100] flex w-[calc(100%-2.5rem)] max-w-md transform items-center gap-3 rounded-2xl border-l-4 
           {% if level == 'success' %}border-emerald-500{% elif level == 'warning' %}border-amber-500{% else %}border-red-500{% endif %} 
           bg-slate-900/95 p-4 text-white shadow-2xl backdrop-blur-xl transition-all duration-300 sm:bottom-6 sm:right-6 sm:w-full" 
    role="alert"
>
    <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl 
                {% if level == 'success' %}bg-emerald-500/20 text-emerald-400{% elif level == 'warning' %}bg-amber-500/20 text-amber-400{% else %}bg-red-500/20 text-red-400{% endif %}">
        {% if level == 'success' %}
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        {% elif level == 'warning' %}
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        {% else %}
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        {% endif %}
    </div>

    <div class="text-xs font-medium text-slate-200 sm:text-sm">{{ message }}</div>

    <button type="button" class="ml-auto flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-white/10 hover:text-white" onclick="this.closest('#toast-auth').remove()">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>

    <script>
        {% if form_id and level == 'success' %}
            document.getElementById('{{ form_id }}')?.reset();
        {% endif %}
        setTimeout(() => {
            const toast = document.getElementById('toast-auth');
            if (toast) {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }
        }, 5000);
    </script>
</div>
