<!-- Global Booking Slide-Over -->
<div x-data="{
        open: false,
        submitted: false,
        selectedAgent: 'Headquarters Dispatch',
        form: { name: '', phone: '', product: 'Day Old Chicks', quantity: '', notes: '' },
        submitBooking() {
            this.submitted = true;
            setTimeout(() => {
                this.open = false;
                this.submitted = false;
                this.form = { name: '', phone: '', product: 'Day Old Chicks', quantity: '', notes: '' };
            }, 2500);
        }
    }"
    @open-booking.window="open = true; selectedAgent = $event.detail || 'Headquarters Dispatch'"
    x-effect="document.body.classList.toggle('overflow-hidden', open)"
    class="relative z-[100]"
    x-cloak>

    <!-- Backdrop Fade -->
    <div x-show="open" 
        x-transition.opacity.duration.300ms
        @click="open = false"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 overflow-hidden">
            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
                
                <!-- Slide Panel -->
                <div x-show="open"
                    x-transition:enter="transform transition ease-in-out duration-500 sm:duration-700"
                    x-transition:enter-start="translate-x-full"
                    x-transition:enter-end="translate-x-0"
                    x-transition:leave="transform transition ease-in-out duration-500 sm:duration-700"
                    x-transition:leave-start="translate-x-0"
                    x-transition:leave-end="translate-x-full"
                    class="pointer-events-auto w-screen max-w-md bg-white dark:bg-slate-900 shadow-2xl flex flex-col h-full border-l border-slate-200 dark:border-slate-800">

                    <!-- Panel Header -->
                    <div class="px-6 py-5 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 flex items-start justify-between shrink-0">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Booking Request</h2>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                                Routing to: <span class="text-emerald-600 dark:text-emerald-400 font-semibold" x-text="selectedAgent"></span>
                            </p>
                        </div>
                        <button @click="open = false" class="p-2 -mr-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- Panel Body Form -->
                    <div class="p-6 overflow-y-auto flex-1 overscroll-contain">
                        <!-- Success State -->
                        <div x-show="submitted" x-transition
                            class="p-5 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800/50 rounded-2xl flex flex-col items-center justify-center text-center space-y-3 h-full">
                            <div class="w-16 h-16 bg-emerald-100 dark:bg-emerald-800/50 rounded-full flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white">Request Sent!</h3>
                            <p class="text-sm text-emerald-800 dark:text-emerald-300">
                                <span x-text="selectedAgent"></span> will contact you shortly to confirm your order.
                            </p>
                        </div>

                        <form x-show="!submitted" @submit.prevent="submitBooking()" class="space-y-5">
                            <!-- Form Fields (Updated with modern focus rings and padding) -->
                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Full Name / Farm Name</label>
                                <input type="text" x-model="form.name" required placeholder="e.g. Abdulsalam Ibraheem"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm placeholder:text-slate-400">
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Phone Number</label>
                                <input type="tel" x-model="form.phone" required placeholder="08100482341"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm placeholder:text-slate-400">
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Product Category</label>
                                <select x-model="form.product"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                                    <option value="Day Old Chicks">Day Old Chicks (Broiler / Layer)</option>
                                    <option value="Premix & Feed">Premix & Feed Additives</option>
                                    <option value="Vaccines">Vaccines & Medications</option>
                                    <option value="Equipment">Farm Equipment</option>
                                </select>
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Quantity / Batch Size</label>
                                <input type="text" x-model="form.quantity" placeholder="e.g. 500 cartons or 20 bags"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm placeholder:text-slate-400">
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Additional Notes</label>
                                <textarea x-model="form.notes" rows="4" placeholder="Target delivery location, preferred breeds..."
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm placeholder:text-slate-400 resize-none"></textarea>
                            </div>
                        </form>
                    </div>

                    <!-- Panel Footer -->
                    <div class="p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 shrink-0">
                        <button type="button" @click="submitBooking()" x-show="!submitted"
                            class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/25 active:scale-[0.98] transition-all">
                            <span>Submit Booking</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
