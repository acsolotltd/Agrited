                <!-- Scrollable List -->

                    <template x-for="loc in locations" :key="loc.id">
                        <button @click="activeLocation = loc.id"

                                <span
                                    class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 whitespace-nowrap"

            </div>

            <!-- Right: Live Google Maps iframe Container -->
            <div
                class="lg:col-span-7 relative bg-slate-200 dark:bg-slate-800 rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-700/50 min-h-[400px]">
                <template x-for="loc in locations" :key="loc.id">
                    <div x-show="activeLocation === loc.id" x-transition:enter="transition ease-out duration-500"
                        x-transition:enter-start="opacity-0 scale-105" x-transition:enter-end="opacity-100 scale-100"
                        class="absolute inset-0">

                        <!-- Embedded Google Map -->
                        <iframe :src="loc.iframeSrc" class="w-full h-full border-0" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>

                        <!-- Map Info Overlay Card (Kept for UI polish) -->
                        <div
                            class="absolute bottom-6 left-6 right-6 p-5 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-2xl border border-slate-200/50 dark:border-white/10 shadow-2xl pointer-events-auto">

                                        </path>

                            </div>

    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
    }

    @media (prefers-color-scheme: dark) {
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;

    }
