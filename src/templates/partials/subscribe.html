<!-- =========================================================
     MOBILE-FIRST NEWSLETTER SECTION
========================================================= -->
<section id="newsletter" class="relative overflow-hidden bg-emerald-800 py-12 transition-colors duration-300 dark:bg-emerald-950 sm:py-16 md:py-24">
    
    <!-- Decorative background glow (safely clipped for mobile) -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -right-20 -top-20 h-72 w-72 rounded-full bg-emerald-400/20 blur-3xl sm:-right-32 sm:-top-32 sm:h-96 sm:w-96"></div>
        <div class="absolute -bottom-32 -left-20 h-72 w-72 rounded-full bg-emerald-950/40 blur-3xl sm:-left-32 sm:h-96 sm:w-96"></div>
    </div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        
        <!-- Glassmorphism Container (Compact corner radius on mobile) -->
        <div class="mx-auto max-w-5xl overflow-hidden rounded-2xl border border-white/15 bg-white/10 shadow-2xl backdrop-blur-xl sm:rounded-3xl">
            <div class="grid grid-cols-1 lg:grid-cols-12">

                <!-- =================================================
                     LEFT COLUMN: Copy & Value Proposition
                ================================================== -->
                <div class="p-6 sm:p-10 lg:col-span-7 lg:p-12">
                    
                    <!-- Badge -->
                    <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs font-bold uppercase tracking-wider text-emerald-100 sm:mb-5">
                        <svg class="h-3.5 w-3.5 sm:h-4 sm:w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <span>Stay Connected</span>
                    </div>

                    <!-- Heading -->
                    <h2 class="text-2xl font-extrabold tracking-tight text-white sm:text-4xl lg:text-4xl">
                        Subscribe to Our
                        <span class="block text-emerald-200 sm:inline">Newsletter</span>
                    </h2>

                    <!-- Description -->
                    <p class="mt-3 text-sm leading-relaxed text-emerald-50/90 sm:mt-4 sm:text-base sm:leading-7">
                        Receive monthly updates on poultry operations, products, farming techniques, and agribusiness insights directly to your inbox.
                    </p>

                    <!-- Feature Checkmarks -->
                    <div class="mt-6 grid grid-cols-2 gap-3 sm:mt-8 sm:gap-4">
                        <div class="flex items-center gap-2 text-xs font-medium text-emerald-50 sm:text-sm">
                            <span class="flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-full bg-emerald-400/20 text-emerald-200 sm:h-6 sm:w-6">
                                <svg class="h-3 w-3 sm:h-3.5 sm:w-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </span>
                            <span>Farm updates</span>
                        </div>

                        <div class="flex items-center gap-2 text-xs font-medium text-emerald-50 sm:text-sm">
                            <span class="flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-full bg-emerald-400/20 text-emerald-200 sm:h-6 sm:w-6">
                                <svg class="h-3 w-3 sm:h-3.5 sm:w-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </span>
                            <span>Industry insights</span>
                        </div>

                        <div class="flex items-center gap-2 text-xs font-medium text-emerald-50 sm:text-sm">
                            <span class="flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-full bg-emerald-400/20 text-emerald-200 sm:h-6 sm:w-6">
                                <svg class="h-3 w-3 sm:h-3.5 sm:w-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </span>
                            <span>Company news</span>
                        </div>

                        <div class="flex items-center gap-2 text-xs font-medium text-emerald-50 sm:text-sm">
                            <span class="flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-full bg-emerald-400/20 text-emerald-200 sm:h-6 sm:w-6">
                                <svg class="h-3 w-3 sm:h-3.5 sm:w-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </span>
                            <span>Product updates</span>
                        </div>
                    </div>
                </div>

                <!-- =================================================
                     RIGHT COLUMN: Form Panel
                ================================================== -->
                <div class="flex items-center border-t border-white/10 bg-black/20 p-6 sm:p-10 lg:col-span-5 lg:border-l lg:border-t-0 lg:p-12">
                    <div class="w-full">
                        
                        <form 
                            id="newsletter-form" 
                            class="space-y-4 sm:space-y-5"
                            name="newsletter"
                            hx-post="http://127.0.0.1:8000/news/Subscribe/"
                            hx-target="#newsletter-response"
                            hx-swap="innerHTML"
                            hx-indicator="#loading-state"
                        >
                            <!-- Full Name -->
                            <div>
                                <label for="newsletter-name" class="mb-1.5 block text-xs font-semibold text-white sm:text-sm">
                                    Full Name <span class="text-emerald-300">*</span>
                                </label>
                                <div class="relative">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                        </svg>
                                    </div>
                                    <input 
                                        id="newsletter-name" 
                                        name="name" 
                                        type="text" 
                                        required 
                                        autocomplete="name" 
                                        placeholder="Ibraheem Abdulsalam" 
                                        class="block w-full rounded-xl border border-white/20 bg-white pl-11 pr-4 py-3 text-base text-slate-900 shadow-sm transition placeholder:text-slate-400 focus:border-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-400/30 sm:py-3.5 sm:text-sm" 
                                    />
                                </div>
                            </div>

                            <!-- Email -->
                            <div>
                                <label for="newsletter-email" class="mb-1.5 block text-xs font-semibold text-white sm:text-sm">
                                    Email address <span class="text-emerald-300">*</span>
                                </label>
                                <div class="relative">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                        </svg>
                                    </div>
                                    <input 
                                        id="newsletter-email" 
                                        name="email" 
                                        type="email" 
                                        required 
                                        autocomplete="email" 
                                        placeholder="name@company.com" 
                                        class="block w-full rounded-xl border border-white/20 bg-white pl-11 pr-4 py-3 text-base text-slate-900 shadow-sm transition placeholder:text-slate-400 focus:border-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-400/30 sm:py-3.5 sm:text-sm" 
                                    />
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button 
                                type="submit" 
                                class="group flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-6 py-3.5 text-sm font-bold text-white shadow-lg transition-all duration-200 hover:bg-slate-900 active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-white/30"
                            >
                                <span>Subscribe Now</span>
                                <svg class="h-4 w-4 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </button>
                        </form>

                        <!-- HTMX Loading Indicator (Hidden by default by HTMX) -->
                        <div id="loading-state" class="htmx-indicator mt-4 flex items-center justify-center gap-2 rounded-lg bg-white/10 p-3 text-xs text-white">
                            <svg class="h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                            <span>Subscribing...</span>
                        </div>

                        <!-- Dynamic Response Container -->
                        <div id="newsletter-response" class="mt-4" aria-live="polite"></div>

                        <!-- Privacy Notice -->
                        <p class="mt-4 text-center text-[11px] leading-relaxed text-emerald-100/70 sm:text-xs">
                            We respect your privacy. Unsubscribe at any time.
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
